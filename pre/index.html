<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>简单弹幕射击游戏 STG</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at top, #182848 0%, #0b1020 55%, #03050a 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 16px;
    }
    canvas {
      border: 2px solid rgba(255,255,255,0.25);
      box-shadow: 0 0 24px rgba(0, 170, 255, 0.2);
      background: linear-gradient(180deg, #050816 0%, #0a1630 100%);
      max-width: 100%;
      height: auto;
    }
    .info {
      text-align: center;
      color: #d6e6ff;
      font-size: 14px;
      line-height: 1.7;
      opacity: 0.95;
    }
    .key {
      display: inline-block;
      min-width: 22px;
      padding: 1px 6px;
      margin: 0 2px;
      border: 1px solid rgba(255,255,255,0.35);
      border-bottom-width: 2px;
      border-radius: 6px;
      background: rgba(255,255,255,0.08);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <canvas id="game" width="480" height="720"></canvas>
    <div class="info">
      操作：<span class="key">↑</span><span class="key">↓</span><span class="key">←</span><span class="key">→</span> 移动，<span class="key">空格</span> 射击，<span class="key">R</span> 重新开始<br />
      目标：击败敌机、躲避弹幕、尽可能获得更高分数。
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;

    const keys = {};
    let stars = [];
    let bullets = [];
    let enemies = [];
    let enemyBullets = [];
    let particles = [];
    let frame = 0;
    let score = 0;
    let gameOver = false;
    let clearFlash = 0;

    const player = {
      x: W / 2,
      y: H - 90,
      r: 10,
      speed: 4.2,
      cooldown: 0,
      lives: 3,
      invincible: 0,
      focus: false
    };

    function initStars() {
      stars = Array.from({ length: 90 }, () => ({
        x: Math.random() * W,
        y: Math.random() * H,
        size: Math.random() * 2 + 1,
        speed: Math.random() * 1.8 + 0.4
      }));
    }

    function resetGame() {
      bullets = [];
      enemies = [];
      enemyBullets = [];
      particles = [];
      frame = 0;
      score = 0;
      gameOver = false;
      clearFlash = 0;
      player.x = W / 2;
      player.y = H - 90;
      player.cooldown = 0;
      player.lives = 3;
      player.invincible = 120;
      initStars();
    }

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function dist(a, b) {
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      return Math.hypot(dx, dy);
    }

    function shootPlayer() {
      const spread = player.focus ? 0 : 10;
      const speed = player.focus ? 8 : 7;
      bullets.push({ x: player.x, y: player.y - 18, vx: 0, vy: -speed, r: 4, dmg: 1.2, color: '#7df9ff' });
      bullets.push({ x: player.x - 10, y: player.y - 8, vx: -spread * 0.05, vy: -speed + 0.2, r: 3, dmg: 1, color: '#b8fff9' });
      bullets.push({ x: player.x + 10, y: player.y - 8, vx: spread * 0.05, vy: -speed + 0.2, r: 3, dmg: 1, color: '#b8fff9' });
    }

    function spawnEnemy() {
      const typeRoll = Math.random();
      if (typeRoll < 0.72) {
        enemies.push({
          type: 'small',
          x: 40 + Math.random() * (W - 80),
          y: -20,
          r: 14,
          hp: 3,
          maxHp: 3,
          speed: 1.6 + Math.random() * 0.9,
          cool: 55 + Math.random() * 40,
          t: Math.random() * Math.PI * 2
        });
      } else {
        enemies.push({
          type: 'elite',
          x: 70 + Math.random() * (W - 140),
          y: -30,
          r: 24,
          hp: 14,
          maxHp: 14,
          speed: 0.9 + Math.random() * 0.4,
          cool: 80,
          t: 0
        });
      }
    }

    function enemyShoot(enemy) {
      if (enemy.type === 'small') {
        const angle = Math.atan2(player.y - enemy.y, player.x - enemy.x);
        enemyBullets.push({
          x: enemy.x,
          y: enemy.y + 8,
          vx: Math.cos(angle) * 2.2,
          vy: Math.sin(angle) * 2.2,
          r: 5,
          color: '#ff8fab'
        });
      } else {
        const base = frame * 0.06;
        for (let i = 0; i < 10; i++) {
          const angle = base + (Math.PI * 2 / 10) * i;
          enemyBullets.push({
            x: enemy.x,
            y: enemy.y,
            vx: Math.cos(angle) * 1.8,
            vy: Math.sin(angle) * 1.8 + 0.5,
            r: 5,
            color: '#ffd166'
          });
        }
      }
    }

    function burst(x, y, color, count = 12) {
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = Math.random() * 2.8 + 0.4;
        particles.push({
          x, y,
          vx: Math.cos(a) * s,
          vy: Math.sin(a) * s,
          life: 20 + Math.random() * 20,
          color
        });
      }
    }

    function update() {
      frame++;
      player.focus = !!keys['Shift'];
      const moveSpeed = player.focus ? player.speed * 0.55 : player.speed;

      if (!gameOver) {
        if (keys['ArrowLeft'] || keys['a']) player.x -= moveSpeed;
        if (keys['ArrowRight'] || keys['d']) player.x += moveSpeed;
        if (keys['ArrowUp'] || keys['w']) player.y -= moveSpeed;
        if (keys['ArrowDown'] || keys['s']) player.y += moveSpeed;
        player.x = clamp(player.x, 18, W - 18);
        player.y = clamp(player.y, 24, H - 24);

        if (player.cooldown > 0) player.cooldown--;
        if (player.invincible > 0) player.invincible--;

        if ((keys[' '] || keys['Space']) && player.cooldown <= 0) {
          shootPlayer();
          player.cooldown = player.focus ? 8 : 10;
        }

        if (frame % 40 === 0) spawnEnemy();
      }

      stars.forEach(star => {
        star.y += star.speed;
        if (star.y > H) {
          star.y = -2;
          star.x = Math.random() * W;
        }
      });

      bullets = bullets.filter(b => b.y > -30);
      bullets.forEach(b => {
        b.x += b.vx;
        b.y += b.vy;
      });

      enemies.forEach(e => {
        e.t += 0.03;
        if (e.type === 'small') {
          e.y += e.speed;
          e.x += Math.sin(e.t * 2.2) * 1.2;
        } else {
          e.y += e.speed;
          e.x += Math.sin(e.t) * 1.6;
        }
        e.cool--;
        if (!gameOver && e.cool <= 0) {
          enemyShoot(e);
          e.cool = e.type === 'small' ? 75 : 110;
        }
      });
      enemies = enemies.filter(e => e.y < H + 60 && e.hp > 0);

      enemyBullets.forEach(b => {
        b.x += b.vx;
        b.y += b.vy;
      });
      enemyBullets = enemyBullets.filter(b => b.x > -40 && b.x < W + 40 && b.y > -40 && b.y < H + 40);

      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        p.vx *= 0.98;
        p.vy *= 0.98;
      });
      particles = particles.filter(p => p.life > 0);

      for (let bi = bullets.length - 1; bi >= 0; bi--) {
        const b = bullets[bi];
        for (let ei = enemies.length - 1; ei >= 0; ei--) {
          const e = enemies[ei];
          if (dist(b, e) < b.r + e.r) {
            e.hp -= b.dmg;
            burst(b.x, b.y, b.color, 4);
            bullets.splice(bi, 1);
            if (e.hp <= 0) {
              score += e.type === 'elite' ? 300 : 100;
              burst(e.x, e.y, e.type === 'elite' ? '#ffd166' : '#ff5d8f', e.type === 'elite' ? 26 : 16);
              if (Math.random() < 0.18) {
                clearFlash = 8;
                enemyBullets = enemyBullets.filter(eb => eb.y < e.y - 40);
              }
            }
            break;
          }
        }
      }

      if (!gameOver && player.invincible <= 0) {
        for (const b of enemyBullets) {
          if (dist(player, b) < player.r + b.r - 2) {
            player.lives--;
            player.invincible = 120;
            burst(player.x, player.y, '#7df9ff', 24);
            enemyBullets = [];
            if (player.lives <= 0) gameOver = true;
            break;
          }
        }

        for (const e of enemies) {
          if (dist(player, e) < player.r + e.r) {
            player.lives = 0;
            gameOver = true;
            burst(player.x, player.y, '#ffffff', 36);
            break;
          }
        }
      }

      if (clearFlash > 0) clearFlash--;
    }

    function drawPlayer() {
      const blink = player.invincible > 0 && Math.floor(player.invincible / 6) % 2 === 0;
      if (blink && !gameOver) return;

      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.beginPath();
      ctx.moveTo(0, -18);
      ctx.lineTo(12, 12);
      ctx.lineTo(0, 6);
      ctx.lineTo(-12, 12);
      ctx.closePath();
      ctx.fillStyle = '#7df9ff';
      ctx.shadowColor = '#7df9ff';
      ctx.shadowBlur = 16;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(0, 0, player.focus ? 4 : 3, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.restore();
    }

    function drawEnemy(e) {
      ctx.save();
      ctx.translate(e.x, e.y);
      ctx.fillStyle = e.type === 'elite' ? '#ffb703' : '#ff5d8f';
      ctx.shadowColor = ctx.fillStyle;
      ctx.shadowBlur = 14;
      ctx.beginPath();
      if (e.type === 'elite') {
        ctx.moveTo(0, -22);
        ctx.lineTo(22, 0);
        ctx.lineTo(0, 22);
        ctx.lineTo(-22, 0);
      } else {
        ctx.moveTo(0, -14);
        ctx.lineTo(13, 10);
        ctx.lineTo(-13, 10);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      const barW = e.type === 'elite' ? 44 : 28;
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.fillRect(e.x - barW / 2, e.y - e.r - 12, barW, 4);
      ctx.fillStyle = '#7df9ff';
      ctx.fillRect(e.x - barW / 2, e.y - e.r - 12, barW * (e.hp / e.maxHp), 4);
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      stars.forEach(s => {
        ctx.fillStyle = `rgba(255,255,255,${0.4 + s.size * 0.2})`;
        ctx.fillRect(s.x, s.y, s.size, s.size * 2);
      });

      bullets.forEach(b => {
        ctx.fillStyle = b.color;
        ctx.shadowColor = b.color;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
      });

      enemyBullets.forEach(b => {
        ctx.fillStyle = b.color;
        ctx.shadowColor = b.color;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
      });

      enemies.forEach(drawEnemy);
      drawPlayer();

      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life / 40);
        ctx.fillRect(p.x, p.y, 3, 3);
        ctx.globalAlpha = 1;
      });

      if (clearFlash > 0) {
        ctx.fillStyle = `rgba(255,255,255,${clearFlash / 24})`;
        ctx.fillRect(0, 0, W, H);
      }

      ctx.fillStyle = '#e8f1ff';
      ctx.font = 'bold 22px Arial';
      ctx.fillText(`得分: ${score}`, 18, 34);
      ctx.fillText(`生命: ${'♥'.repeat(Math.max(0, player.lives))}`, 18, 64);
      ctx.font = '14px Arial';
      ctx.fillStyle = '#b7c7e6';
      ctx.fillText('按住 Shift 低速精确移动', 18, 90);

      if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(0, 0, W, H);
        ctx.textAlign = 'center';
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 42px Arial';
        ctx.fillText('游戏结束', W / 2, H / 2 - 20);
        ctx.font = '24px Arial';
        ctx.fillText(`最终得分：${score}`, W / 2, H / 2 + 24);
        ctx.font = '18px Arial';
        ctx.fillStyle = '#cfe3ff';
        ctx.fillText('按 R 重新开始', W / 2, H / 2 + 64);
        ctx.textAlign = 'left';
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', e => {
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " ", "Space"].includes(e.key)) {
        e.preventDefault();
      }
      keys[e.key] = true;
      if ((e.key === 'r' || e.key === 'R') && gameOver) resetGame();
    });

    window.addEventListener('keyup', e => {
      keys[e.key] = false;
    });

    resetGame();
    loop();
  </script>
</body>
</html>
